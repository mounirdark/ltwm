<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />

<title>LTWM ❤️</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at top, #ff9a9e, #fad0c4, #fbc2eb);
    overflow: hidden;
}

.container {
    width: 90%;
    max-width: 500px;
    text-align: center;
}

/* Splash */
#splash {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at top, #ff5f7e, #ff9a9e);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: white;
    font-size: 28px;
    font-weight: bold;
    z-index: 10;
    animation: fadeOut 2s ease forwards;
    animation-delay: 1.5s;
}

@keyframes fadeOut {
    to { opacity: 0; visibility: hidden; }
}

.card {
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(18px);
    border-radius: 28px;
    padding: 30px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.2);
    font-size: 22px;
    min-height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    color: #222;
}

button {
    margin-top: 20px;
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 16px;
    font-size: 18px;
    background: #ff4d6d;
    color: white;
    font-weight: bold;
    box-shadow: 0 10px 20px rgba(255,77,109,0.3);
}

button:active {
    transform: scale(0.97);
}

.top {
    margin-bottom: 10px;
    font-size: 14px;
    opacity: 0.7;
}

.fade {
    opacity: 0;
    transform: translateY(20px);
}
</style>
</head>
